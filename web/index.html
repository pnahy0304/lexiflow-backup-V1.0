<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LexiFlow - Từ điển Oxford chuẩn xác, dịch Tiếng Việt TFLAT, quét văn bản qua Camera OCR và thuật toán lặp lại ngắt quãng SM-2 giúp ghi nhớ từ vựng tiếng Anh dài lâu.">
  <meta name="theme-color" content="#0B0F19">

  <!-- Open Graph / Social Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LexiFlow - Oxford Dictionary & SM-2 Flashcard App">
  <meta property="og:description" content="Từ điển Oxford & TFLAT kết hợp thẻ nhớ lặp lại ngắt quãng SM-2 và quét camera OCR.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LexiFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <title>LexiFlow - Oxford Dictionary & SM-2 Flashcards</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }
    #web-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #151C2C 0%, #0B0F19 100%);
      z-index: 99999;
      transition: opacity 0.5s ease;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-container svg {
      width: 44px;
      height: 44px;
      fill: #6366F1;
    }
    .brand-title {
      margin-top: 20px;
      font-size: 26px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
    }
    .spinner {
      margin-top: 28px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5); }
    }
  </style>
</head>
<body>
  <div id="web-preloader">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="brand-title">LexiFlow</div>
    <div class="brand-sub">Đang tải trải nghiệm từ điển Oxford & Flashcard...</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('load', function() {
      var preloader = document.getElementById('web-preloader');
      if (preloader) {
        setTimeout(function() {
          preloader.style.opacity = '0';
          setTimeout(function() { preloader.style.display = 'none'; }, 500);
        }, 800);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
